<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RecordWatch Admin | RecordPathAI</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="recordwatch-dashboard-page">
  <header class="site-header"><div class="container"><div class="header-shell header-shell-modern"><div class="header-inner"><a href="../index.html" class="site-brand"><img src="/assets/images/logo/RecordPathAI_Logo_Transparent.png" alt="RecordPathAI" class="site-logo"></a><nav class="nav"><a href="../dashboard.html">Dashboard</a><a href="../recordwatch-dashboard.html">RecordWatch</a><a href="../recordwatch.html">Enrollment</a></nav></div></div></div></header>
  <main>
    <section class="page-hero"><div class="container hero-card"><span class="eyebrow">Admin</span><h1>RecordWatch Admin Dashboard</h1><p>Monitor subscribers, upcoming eligibility events, delivery outcomes, and communication usage.</p><div class="hero-actions"><button class="btn" id="runDaily" type="button">Run Daily Job Preview</button></div></div></section>
    <section class="recordwatch-section"><div class="container recordwatch-stack"><div class="summary-grid" id="adminSummary"></div><section class="page-card"><h2>Reminder Operations</h2><div id="adminLog" class="record-list"></div></section></div></section>
  </main>
  <script src="../js/recordwatch-notifications.js"></script>
  <script>
    (function () {
      function esc(value) { return String(value || "").replace(/[&<>'"]/g, function (char) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[char]; }); }
      function render() {
        var summary = RecordWatchNotifications.getAdminSummary();
        var labels = [
          ["Total subscribers", summary.total_subscribers],
          ["Upcoming eligibility events", summary.upcoming_eligibility_events],
          ["Notifications sent", summary.notifications_sent],
          ["Failed deliveries", summary.failed_deliveries],
          ["SMS usage", summary.sms_usage],
          ["Email usage", summary.email_usage]
        ];
        document.getElementById("adminSummary").innerHTML = labels.map(function (item) { return '<article class="summary-card"><p class="eyebrow-mini">' + esc(item[0]) + '</p><h3>' + esc(item[1]) + '</h3></article>'; }).join("");
        var notifications = RecordWatchNotifications.loadNotifications().slice().reverse();
        document.getElementById("adminLog").innerHTML = notifications.length ? notifications.map(function (item) { return '<article class="record-card"><h3>' + esc(item.subject) + '</h3><p>' + esc(item.type) + ' · ' + esc(item.channel) + ' · ' + esc(item.status) + '</p><p class="muted">' + esc(item.sent_at) + '</p></article>'; }).join("") : '<div class="empty-state"><h2>No notifications logged yet</h2><p>Activate RecordWatch or run the daily job preview to create reminder history.</p></div>';
      }
      document.getElementById("runDaily").addEventListener("click", function () { RecordWatchNotifications.runDailyCheck(); render(); });
      render();
      fetch("/api/recordwatch/admin-summary").then(function (response) { return response.json(); }).then(function (summary) { console.info("Server RecordWatch summary", summary); }).catch(function () {});
    }());
  </script>
</body>
</html>
