  <meta charset="UTF-8" />

  <div class="wrap">
    <a href="index.html" class="site-brand">
      <img
        src="/assets/images/logo/RecordPathAI_Logo_Transparent.png"
        alt="RecordPathAI"
        class="site-logo"
      >

    <h1>Verifying your payment...</h1>
    <p>Verifying your Stripe payment before unlocking the packet.</p>
    <a href="packet.html" class="payment-return" hidden>Return to Packet</a>
  </div>

  <script src="js/i18n.js" defer></script>
  <script src="js/supabase-client.js"></script><script src="js/user-store.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async function () {
      // Only Stripe verification by the authenticated server can unlock a packet.
      localStorage.removeItem("recordPathPaymentComplete");
      const heading = document.querySelector(".wrap h1");
      const description = document.querySelector(".wrap p");
      const returnLink = document.querySelector(".payment-return");
      heading.textContent = "Verifying your payment...";
      description.textContent = "Checking your Stripe payment securely before unlocking the packet.";
      returnLink.hidden = true;
      const sessionId = new URLSearchParams(window.location.search).get("session_id") || "";
      try {
        if (!/^cs_(test|live)_[A-Za-z0-9]+$/.test(sessionId)) throw new Error("Missing checkout reference");
        if (!window.RecordPathSupabase) throw new Error("Sign in required");
        const supabase = await window.RecordPathSupabase.getClient();
        const authResult = await supabase.auth.getSession();
        const token = authResult?.data?.session?.access_token;
        if (!token) throw new Error("Sign in required");
        const verify = await fetch("/api/packet/verify-payment", {
          method: "POST",
          headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
          body: JSON.stringify({ session_id: sessionId }),
          cache: "no-store"
        });
        const result = await verify.json();
        if (!verify.ok || result.paid !== true || result.sessionId !== sessionId)
          throw new Error("Payment not verified for this account");
        sessionStorage.setItem("recordPathStripeCheckoutSessionId", sessionId);
        heading.textContent = "Payment verified. Your packet is unlocked.";
        description.textContent = "Your purchase is confirmed. Return to your packet to generate it.";
        returnLink.href = "packet.html?session_id=" + encodeURIComponent(sessionId);
        returnLink.hidden = false;
        // Ledger posting is idempotent and never determines access by itself.
        try {
          await fetch("/api/ledger/packet-purchase", {
            method: "POST",
            headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
            body: JSON.stringify({ stripe_session_id: sessionId }),
            cache: "no-store"
          });
        } catch (_) { /* Verification succeeded; ledger can recover separately. */ }
      } catch (error) {
        sessionStorage.removeItem("recordPathStripeCheckoutSessionId");
        heading.textContent = "Payment verification is required.";
        description.textContent = "Sign in to the account used for checkout and retry verification. No new payment is required.";
        returnLink.textContent = "Sign in and verify";
        returnLink.href = "login.html?returnUrl=" + encodeURIComponent("payment-success.html?session_id=" + sessionId);
        returnLink.hidden = false;
      }
    }());
  </script>
