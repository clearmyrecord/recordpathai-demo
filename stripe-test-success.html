<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stripe Sandbox Test | RecordPathAI</title>
<meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="css/styles.css">
<style>body{background:#eef2f8;color:#233d70;font-family:Arial,sans-serif}.demo-panel{max-width:700px;margin:9vh auto;background:white;border:1px solid #dbe3f0;border-radius:24px;padding:36px;box-shadow:0 10px 30px #233d7010}.demo-panel h1{margin-top:0}.demo-label{display:inline-block;padding:8px 12px;border-radius:10px;background:#fff2d2;color:#714c0a;font-weight:800}.demo-panel a{color:#265da6;font-weight:700}</style></head>
<body><main class="demo-panel"><p class="demo-label">TEST MODE ONLY — NO REAL MONEY</p>
<h1 id="resultTitle">Stripe sandbox checkout returned</h1>
<p id="resultBody">This is a Stripe test checkout. No real customer account has been charged, no packet has been unlocked, no check issued and nothing filed or mailed.</p>
<button id="verify" type="button" hidden>Verify test payment and render Lob proof</button>
<a id="proof" hidden target="_blank" rel="noreferrer">Open verified test proof</a>
</main><script>
const params=new URLSearchParams(location.search);
const sessionId=params.get("session_id");
const button=document.getElementById("verify");
const status=document.getElementById("resultBody");
if(params.has("cancelled")){
  document.getElementById("resultTitle").textContent="Test checkout cancelled";
}else if(/^cs_test_[A-Za-z0-9]{16,180}$/.test(sessionId||"")){
  button.hidden=false;
  button.onclick=async()=>{
    button.disabled=true;
    status.textContent="Checking payment with Stripe and requesting the Lob test proof…";
    try{
      const response=await fetch("/api/packet/sandbox-proof",{method:"POST",
        headers:{"Content-Type":"application/json"},body:JSON.stringify({session_id:sessionId})});
      const result=await response.json();
      if(!response.ok)throw Error(result.error||"Proof check unavailable.");
      if(result.proofContentsVerified && result.proofUrl){
        status.textContent="Stripe confirmed the $150 test payment. Lob rendered a four-page proof with the $100 test check and two sample form pages. "+(result.webhookConfirmed?"Signed Stripe webhook received.":"Signed webhook delivery is still unconfirmed.");
        const link=document.getElementById("proof");
        link.href=result.proofUrl;link.hidden=false;button.hidden=result.webhookConfirmed;button.textContent="Recheck signed webhook delivery";
      }else{
        status.textContent="Stripe confirmed payment. Lob test check "+result.testCheckId+
          " is "+result.renderStatus+". The PDF has not passed verification. Select the button again to check.";
      }
    }catch(error){status.textContent=error.message;}
    finally{button.disabled=false;}
  };
}
</script></body></html>
