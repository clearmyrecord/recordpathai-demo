name: Verify canonical RecordPathAI deployment
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Inspect public canonical site without names or case queries
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          root="https://recordpathai.com"
          for path in ("/","/self-search.html"):
              try:
                  req=urllib.request.Request(root+path,headers={"User-Agent":"RecordPathAI-deployment-check/1.0"})
                  with urllib.request.urlopen(req,timeout=45) as response:
                      data=response.read(200000).decode("utf8","replace")
                      print("Production HTTPS check",path,"HTTP",response.status,
                            "guided_search_page",('id="find"' in data),
                            "latest_home_search_nav",('href="self-search.html"' in data))
                      if path=="/self-search.html" and 'id="find"' in data:
                          print("PRODUCTION_SEARCH_RELEASE=present")
                      elif path=="/self-search.html":
                          print("PRODUCTION_SEARCH_RELEASE=not_verified")
              except Exception as e:
                  print("PRODUCTION_CHECK_UNAVAILABLE",path,type(e).__name__)
          try:
              with urllib.request.urlopen(root+"/packet.html",timeout=45) as response:
                  packet=response.read(350000).decode("utf8","replace")
                  print("PRODUCTION_PACKET_CASE_SCOPE=" + ("present" if
                       "result.caseId === savedCaseId" in packet and
                       'case_id: savedCaseId' in packet else "not_verified"))
              with urllib.request.urlopen(root+"/payment-success.html",timeout=45) as response:
                  success=response.read(35000).decode("utf8","replace")
                  print("PRODUCTION_STRIPE_RETURN_VERIFICATION=" + ("present" if
                       '/api/packet/verify-payment' in success and
                       'recordPathStripeCheckoutSessionId' in success else "not_verified"))
          except Exception as e:
              print("PRODUCTION_PACKET_CHECK_UNAVAILABLE",type(e).__name__)
          # Probe only anonymous status codes; never print API response bodies or account data.
          for url,method in [
              ("/api/config/supabase","GET"),
              ("/api/create-checkout-session","POST"),
              ("/api/packet/verify-payment","POST")
          ]:
              try:
                  req=urllib.request.Request(root+url,method=method,headers={
                      "Content-Type":"application/json",
                      "User-Agent":"RecordPathAI-deployment-check/1.0"
                  },data=(b"{}" if method=="POST" else None))
                  with urllib.request.urlopen(req,timeout=45) as response:
                      code=response.status
              except urllib.error.HTTPError as e:
                  code=e.code
              except Exception as e:
                  print("PRODUCTION_API_UNAVAILABLE",url,type(e).__name__)
                  continue
              print("PRODUCTION_API",url,"HTTP",code)
              if url=="/api/create-checkout-session":
                  print("PRODUCTION_CHECKOUT_AUTH_GUARD=" + ("present" if code==401 else "not_verified"))
          PY
