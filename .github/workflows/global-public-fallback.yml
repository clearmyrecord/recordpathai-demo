name: Public global fallback checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble public-only static release
        run: node tools/build-global-public.cjs
      - name: Check public entrypoints, link safety and no secret files
        run: |
          node - <<'NODE'
          const fs=require("node:fs"),path=require("node:path"),assert=require("node:assert/strict"),vm=require("node:vm");
          const dir="global-public-build";
          const expected=[
            "assets/styles.css","assets/home-modern.css","assets/legacy-header.css","assets/images/logo/RecordPathAI_Logo_Transparent.png","css/styles.css","js/legacy-header.js","assets/forms/ga/statewide/arrest-agency/restrict-arrest-record-prior-2013.pdf","assets/forms/ohio/wood/court-of-common-pleas/application-for-sealing-2953-33-dismissal.pdf","index.html","js/form-pipeline-core.js","js/pdf-auto-map.js","js/pilot-demo.js","js/recordpath-home.js","js/wood-county-record-prefill.js","launch.html","pdf-mapper-v6.html","pdf-mapper-v7.html","pilot-demo.html","resources/entrepreneurship.html","resources/resources.js","robots.txt","self-search.html","start.html"
          ].sort();
          function walk(root,pre=""){return fs.readdirSync(root,{withFileTypes:true}).flatMap(f=>f.isDirectory()?walk(path.join(root,f.name),pre+f.name+"/"):[pre+f.name]);}
          assert.deepEqual(walk(dir).sort(),expected);
          const home=fs.readFileSync(path.join(dir,"index.html"),"utf8");
          const search=fs.readFileSync(path.join(dir,"self-search.html"),"utf8");
          assert(home.includes('href="self-search.html"'));
          assert(search.includes('wood-county-record-prefill.js'));
          assert(search.includes('location.hostname'));
          new vm.Script(fs.readFileSync(path.join(dir,"js/wood-county-record-prefill.js"),"utf8"));
          const planner=fs.readFileSync(path.join(dir,"start.html"),"utf8");
          assert(planner.includes('id="planner"'));
          assert(planner.includes('No names or case numbers collected'));
          assert(planner.includes('name="robots" content="noindex'));
          assert(!home.includes('id="query"'));
          assert(home.includes('href="https://recordpathai.com/eligibility.html"'));
          assert(home.includes('href="https://recordpathai.com/pricing.html"'));
          assert(!home.includes('src="js/auth.js"'));
          const plannerScript=planner.split("<script>")[1]?.split("</script>")[0];
          assert(plannerScript);
          new vm.Script(plannerScript);
          const pilot=fs.readFileSync(path.join(dir,"pilot-demo.html"),"utf8");
          assert(pilot.includes('ILLUSTRATIVE') || pilot.includes('Illustrative demo'));
          assert(pilot.includes('Synthetic') || pilot.includes('fictional'));
          assert(pilot.includes('js/pilot-demo.js'));
          assert(!home.includes('href="https://recordpathai.com/pilot-demo.html"'));
          assert(home.includes('Find out if your record'));
          new vm.Script(fs.readFileSync(path.join(dir,"js/pilot-demo.js"),"utf8"));
          const launch=fs.readFileSync(path.join(dir,"launch.html"),"utf8");
          assert(launch.includes("PUBLIC BETA"));
          assert(launch.includes('name="robots" content="noindex'));
          assert(launch.includes("does not operate a nationwide criminal-record database"));
          assert(home.includes('https://recordpathai.com/eligibility.html'));
          assert(search.includes('https://recordpathai-private-search-backend.onrender.com'));
          assert(search.includes('method:"POST"'));
          assert(home.includes('name="robots" content="noindex'));
          assert(search.includes('name="robots" content="noindex'));
          for(const js of ["js/recordpath-home.js","js/pilot-demo.js","resources/resources.js"])new vm.Script(fs.readFileSync(path.join(dir,js),"utf8"));
          const inline=search.split("<script>")[1]?.split("</script>")[0];assert(inline);new vm.Script(inline);
          const mapper=fs.readFileSync(path.join(dir,"pdf-mapper-v6.html"),"utf8");
          assert(mapper.includes("pdf-auto-map.js"));
          assert(mapper.includes("WOOD_PDF_ASSET"));
          assert(mapper.includes('name="robots" content="noindex'));
          assert(!mapper.includes('src="js/auth.js"'));
          const mapperInline=mapper.split("<script>")[1]?.split("</script>")[0];
          assert(mapperInline);
          new vm.Script(mapperInline);
          new vm.Script(fs.readFileSync(path.join(dir,"js/pdf-auto-map.js"),"utf8"));
          const blankCourtPdf=fs.readFileSync(path.join(dir,"assets/forms/ohio/wood/court-of-common-pleas/application-for-sealing-2953-33-dismissal.pdf"));
          assert(blankCourtPdf.subarray(0,4).toString("ascii")==="%PDF");
          assert(blankCourtPdf.length>100000);
          const gaBlank=fs.readFileSync(path.join(dir,"assets/forms/ga/statewide/arrest-agency/restrict-arrest-record-prior-2013.pdf"));
          assert(gaBlank.subarray(0,5).toString("ascii")==="%PDF-");
          assert(gaBlank.length>10000 && gaBlank.length<2000000);
          const v7=fs.readFileSync(path.join(dir,"pdf-mapper-v7.html"),"utf8");
          assert(v7.includes("form-pipeline-core.js"));
          assert(v7.includes("candidateManifestUpload"));
          assert(v7.includes("loadGeorgiaPdfBtn"));
          assert(v7.includes("ga-pre2013"));
          assert(v7.includes("syntheticDataInput"));
          assert(v7.includes('name="robots" content="noindex'));
          assert(!v7.includes('src="js/auth.js"'));
          const inlineV7=v7.split("<script>")[1]?.split("</script>")[0];
          assert(inlineV7);
          new vm.Script(inlineV7);
          new vm.Script(fs.readFileSync(path.join(dir,"js/form-pipeline-core.js"),"utf8"));
          console.log("Public fallback contains only approved assets and valid client-side scripts.");
          NODE
