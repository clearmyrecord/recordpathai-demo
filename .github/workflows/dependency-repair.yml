name: Repair vulnerable npm dependencies
on:
  push:
    paths:
      - .github/workflows/dependency-repair.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit fix --ignore-scripts
      - run: npm run test:security
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit repaired dependency lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Update vulnerable npm dependency versions"
            git push
          fi
