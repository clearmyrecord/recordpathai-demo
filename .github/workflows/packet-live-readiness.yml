name: RecordPathAI filing readiness (read-only)
on:
  workflow_run:
    workflows: ['Deploy RecordPathAI to Google Cloud Run']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'recordpathai-production' }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION || 'us-west1' }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'recordpathai' }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate using deployment identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Inspect active Cloud Run configuration without values
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$CLOUD_RUN_REGION" --format=json > /tmp/recordpathai-service.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/recordpathai-service.json'))
          e={}
          for sec in (p.get('spec',{}).get('template',{}).get('spec',{}).get('containers',[]),
                      p.get('template',{}).get('containers',[])):
              for c in sec:
                  for x in c.get('env',[]):
                      e[x.get('name','')]=x
          flags=['RECORDPATH_LIVE_PACKET_CHECKOUT','LOB_LIVE_CHECKS_ENABLED',
                 'LOB_CHECK_ATTACHMENTS_APPROVED','RECORDPATH_ENABLE_LIVE_DISPATCH']
          envs=['STRIPE_SECRET_KEY','STRIPE_WEBHOOK_SECRET','STRIPE_TEST_SECRET_KEY',
                'SUPABASE_SERVICE_ROLE_KEY','SUPABASE_URL','PUBLIC_SUPABASE_URL',
                'RECORDPATH_OPERATIONS_KEY','LOB_LIVE_API_KEY','LOB_VERIFIED_BANK_ID',
                'LOB_FROM_ADDRESS_JSON','LOB_TEST_API_KEY','LOB_TEST_BANK_ACCOUNT_ID',
                'LOB_TEST_2PAGE_FORM_URL']
          print('READ-ONLY integration audit. Values and secret identifiers are never printed.')
          for k in flags:
              x=e.get(k)
              v=x.get('value') if x else None
              print('FLAG',k, 'enabled' if v=='true' else 'disabled' if v is not None else 'secret-backed/unresolved' if x else 'absent')
          for k in envs:
              x=e.get(k)
              print('CONFIG',k,'secret-backed' if x and ('valueSource' in x or 'valueFrom' in x) else 'set' if x and x.get('value') else 'unset')
          if e.get('LOB_TEST_2PAGE_FORM_URL',{}).get('value','') == 'https://recordpathai.com/assets/lob-wood-two-form-TEST-ONLY.pdf':
              print('FIXTURE configured as expected')
          else:
              print('FIXTURE not configured to approved synthetic test asset')
          # Read-only access probe. Credentials are never printed or persisted.
          import os,subprocess
          for var in ('STRIPE_SECRET_KEY','RECORDPATH_OPERATIONS_KEY','LOB_TEST_API_KEY'):
              source=(e.get(var,{}).get('valueFrom') or e.get(var,{}).get('valueSource') or {}).get('secretKeyRef',{})
              secret=source.get('name'); version=source.get('key','latest')
              if not secret:
                  print('ACCESS',var,'no-secret-reference')
                  continue
              try:
                  check=subprocess.run(['gcloud','secrets','versions','access',version,
                      '--secret',secret,'--project',os.environ['GCP_PROJECT_ID']],
                      stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=18)
                  print('ACCESS',var,'available' if check.returncode==0 else 'unavailable')
              except Exception:
                  print('ACCESS',var,'unavailable')
          t=p.get('status',{}).get('traffic',[])
          print('SERVICE active_revisions',len([x for x in t if x.get('percent',0)>0]),'total_percent',sum(x.get('percent',0) for x in t))
          PY
          rm -f /tmp/recordpathai-service.json
      - name: Verify packet database through protected read-only API
        shell: bash
        run: |
          set -euo pipefail
          set +x
          project="$GCP_PROJECT_ID"
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$project" --region "$CLOUD_RUN_REGION" --format='value(status.url)')"
          if [[ "$url" != https://*.run.app ]]; then
            echo "Packet database check: Cloud Run URL unavailable."
            exit 1
          fi
          # CI deploy identity intentionally lacks Secret Manager versions.access.
          # Do not broaden IAM permissions or fail the production health audit
          # merely because least-privilege prevents this protected operator check.
          ops="$(gcloud secrets versions access latest --secret=recordpath-operations-key --project "$project" 2>/dev/null)" || {
            echo "::warning::Protected packet database check requires an operator Cloud Shell identity; GitHub deploy IAM intentionally cannot read this secret."
            echo "PACKET_DATABASE MANUAL_OPERATOR_VERIFICATION_REQUIRED"
            exit 0
          }
          if [ "${#ops}" -lt 32 ]; then
            echo "::warning::Protected packet database check was not run: operator secret unavailable."
            echo "PACKET_DATABASE MANUAL_OPERATOR_VERIFICATION_REQUIRED"
            exit 0
          fi
          status="$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/packet-readiness.json" --write-out '%{http_code}' -H "x-recordpath-operations-key: $ops" "$url/api/operator/packet/database-readiness")"
          unset ops
          python3 - "$status" "$RUNNER_TEMP/packet-readiness.json" <<'PY'
          import json,sys
          try: result=json.load(open(sys.argv[2]))
          except (OSError,ValueError): result={}
          tables=result.get("tables") or {}
          for name in ("packet_releases","packet_drafts","packet_fulfillment_jobs"):
              print("TABLE",name,"ready" if tables.get(name) is True else "not-ready")
          print("ATOMIC_DISPATCH","ready" if result.get("atomicDispatchFunction") is True else "not-ready")
          verified=(sys.argv[1]=="200" and result.get("ok") is True and
              all(tables.get(name) is True for name in
              ("packet_releases","packet_drafts","packet_fulfillment_jobs")) and
              result.get("atomicDispatchFunction") is True)
          print("PACKET_DATABASE", "PASS" if verified else "FAIL", "HTTP",sys.argv[1])
          if not verified: raise SystemExit(1)
          PY
      - name: Verify public read-only endpoints
        shell: bash
        run: |
          set -euo pipefail
          set +e
          for base in 'https://recordpathai.com' \
            "$(gcloud run services describe "$CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$CLOUD_RUN_REGION" --format='value(status.url)')"; do
            [ -n "$base" ] || continue
            case "$base" in
              'https://recordpathai.com') label='custom_domain';;
              *) label='cloud_run_direct';;
            esac
            status="$(curl -sS -L --max-time 20 -o /tmp/lob-form-fixture.pdf -w '%{http_code}' "$base/assets/lob-wood-two-form-TEST-ONLY.pdf")"
            if [ "$status" = 200 ]; then
              python3 - <<'PY'
          from pathlib import Path
          b=Path('/tmp/lob-form-fixture.pdf').read_bytes()
          assert 500<len(b)<4_194_304 and b.startswith(b'%PDF-')
          assert b'ADDRESS VERIFICATION' in b and b'APPLICATION TO SEAL RECORD OF CONVICTION' in b
          assert b'SANDBOX TEST ONLY' in b
          print('Synthetic sandbox PDF: valid PDF markers')
          PY
              valid="$?"
              echo "PUBLIC_ASSET $label status=$status pdf_valid=$([ "$valid" = 0 ] && echo yes || echo no)"
            else
              echo "PUBLIC_ASSET $label status=$status"
            fi
          done
          exit 0
