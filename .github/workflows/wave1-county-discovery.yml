name: Wave 1 county form discovery agents
on:
  schedule:
    # Weekdays. Search is disabled unless WAVE1_SEARCH_ENABLED=true and SERPAPI_KEY is present.
    - cron: '23 14 * * 1-5'
  workflow_dispatch:
    inputs:
      state:
        description: 'Single state or all five'
        type: choice
        default: all
        options: [all, NV, TX, FL, AZ, GA]
      limit:
        description: 'Maximum counties per state'
        type: choice
        default: '5'
        options: ['1', '5', '10', '15']
      queries:
        description: 'Provider requests per county (1–2)'
        type: choice
        default: '1'
        options: ['1', '2']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: recordpathai-wave1-form-discovery
  cancel-in-progress: false
jobs:
  research:
    name: Research ${{ matrix.state }} public court form leads
    if: ${{ github.event_name == 'schedule' || inputs.state == 'all' || inputs.state == matrix.state }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        state: [NV, TX, FL, AZ, GA]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore previous county progress
        run: |
          if git fetch origin refs/heads/automation/wave1-discovery:refs/remotes/origin/automation/wave1-discovery 2>/dev/null; then
            git show origin/automation/wave1-discovery:data/wave1-agent-progress.json > /tmp/wave1-progress.json || true
          fi
          test -s /tmp/wave1-progress.json || echo '{"counties":{},"sources":[]}' > /tmp/wave1-progress.json
      - name: Run bounded state discovery agent
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          WAVE1_SEARCH_ENABLED: ${{ vars.WAVE1_SEARCH_ENABLED }}
          AGENT_STATE: ${{ matrix.state }}
          AGENT_LIMIT: ${{ inputs.limit || '5' }}
          AGENT_QUERIES: ${{ inputs.queries || '1' }}
        run: |
          node tools/run-wave1-state-agent.mjs --state="$AGENT_STATE" \
            --limit="$AGENT_LIMIT" --queries="$AGENT_QUERIES" --mode=search \
            --ledger=/tmp/wave1-progress.json --output=".wave1-agent-output/$AGENT_STATE.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wave1-${{ matrix.state }}
          path: .wave1-agent-output/${{ matrix.state }}.json
          if-no-files-found: error
          retention-days: 21
  consolidate:
    name: Consolidate public leads into separate review branch
    needs: research
    if: always() && needs.research.result != 'failure' && needs.research.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: wave1-*
          path: .wave1-agent-input
          merge-multiple: true
      - name: Restore previous progress
        run: |
          if git fetch origin refs/heads/automation/wave1-discovery:refs/remotes/origin/automation/wave1-discovery 2>/dev/null; then
            git show origin/automation/wave1-discovery:data/wave1-agent-progress.json > /tmp/wave1-progress.json || true
            if test -s /tmp/wave1-progress.json; then cp /tmp/wave1-progress.json data/wave1-agent-progress.json; fi
          fi
      - name: Deduplicate and summarize source leads
        run: node tools/consolidate-wave1-agent-results.mjs --inputs=.wave1-agent-input
      - name: Save research in review-only branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! test -f data/wave1-agent-progress.json; then
            echo "Search disabled or no successful search results. No changes."
            exit 0
          fi
          cp data/wave1-agent-progress.json /tmp/wave1-result.json
          cp docs/wave1-discovery-dashboard.md /tmp/wave1-dashboard.md
          git fetch origin main
          if git show-ref --quiet refs/remotes/origin/automation/wave1-discovery; then
            git switch -C automation/wave1-discovery origin/automation/wave1-discovery
            git merge --no-edit -X ours origin/main
          else
            git switch -c automation/wave1-discovery origin/main
          fi
          cp /tmp/wave1-result.json data/wave1-agent-progress.json
          cp /tmp/wave1-dashboard.md docs/wave1-discovery-dashboard.md
          git config user.name "RecordPathAI Discovery Coordinator"
          git config user.email "actions@users.noreply.github.com"
          git add data/wave1-agent-progress.json docs/wave1-discovery-dashboard.md
          if git diff --cached --quiet; then
            echo "No new discovery results."
            exit 0
          fi
          git commit -m "Research Wave 1 court form leads: human review required"
          git push origin automation/wave1-discovery
          if ! gh pr list --head automation/wave1-discovery --base main --state open --json number --jq '.[0].number' | grep -q '[0-9]'; then
            gh pr create --head automation/wave1-discovery --base main \
              --title "Review Wave 1 form discovery leads (NOT approved)" \
              --body "County research only. Discovered URLs remain unverified; no form mapping, legal routing, eligibility, payment, mail or court filing is activated."
          fi
