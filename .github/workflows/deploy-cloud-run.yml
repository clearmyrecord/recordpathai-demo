name: Deploy RecordPathAI to Google Cloud Run (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'recordpathai-production' }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION || 'us-west1' }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'recordpathai' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deploy target and runtime
        run: |
          node --check server.js
          node -p 'require("./package.json").engines.node'
          test -f self-search.html
          test -f scripts/deploy-existing-cloudrun.sh
          bash -n scripts/deploy-existing-cloudrun.sh
      - name: Authenticate with short-lived Google identity
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy existing Cloud Run service and roll back on failed smoke test
        run: bash scripts/deploy-existing-cloudrun.sh
