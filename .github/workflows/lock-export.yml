name: Build patched dependency lock
on:
  pull_request:
    paths:
      - package-lock.json
      - package.json
      - .github/workflows/lock-export.yml
      - .github/workflows/refresh-release-dependencies.yml
      - docs/cloud-run-release.md
permissions:
  contents: read
jobs:
  patch-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve patched dependency lock
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Emit patched public lockfile for review
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const content=fs.readFileSync('package-lock.json');
          const encoded=content.toString('base64');
          console.log('PATCHED_LOCK_BEGIN');
          for(let i=0;i<encoded.length;i+=160)console.log(encoded.slice(i,i+160));
          console.log('PATCHED_LOCK_END');
          NODE
